name: Sync Assets from GitVerse

on:
  schedule:
    - cron: '15 2 * * *'   # daily at 02:15 UTC
  workflow_dispatch:        # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest assets from GitVerse
        run: |
          curl -fL "https://bno-inr-ras.gitverse.site/sky-coord-transforms/scripts/iers.js" -o iers.js
          curl -fL "https://gitverse.ru/api/repos/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-astronomy-engine%2Fequatorial-astronomy-engine.js" -o equatorial-astronomy-engine.js
          curl -fL "https://gitverse.ru/api/repos/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa%2Fequatorial-erfa.js" -o equatorial-erfa.js
          curl -fL "https://gitverse.ru/api/repos/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa%2Ferfa.js" -o erfa.js
          curl -fL "https://gitverse.ru/api/repos/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa%2Ferfa.wasm" -o erfa.wasm

      - name: Commit, Push, and Purge CDN Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iers.js equatorial-astronomy-engine.js equatorial-erfa.js erfa.js erfa.wasm

          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: daily update of astronomical assets [$(date +'%Y-%m-%d')]"
          git push

          FILES=("iers.js" "equatorial-astronomy-engine.js" "equatorial-erfa.js" "erfa.js" "erfa.wasm")
          REPO="islam-unatlokov/sky-coord"
          BRANCH="main"

          echo "Purging jsDelivr cache..."
          for file in "${FILES[@]}"; do
            url="https://purge.jsdelivr.net/gh/$REPO@$BRANCH/$file"
            echo "Purging $url"
            success=false
            for attempt in 1 2 3; do
              response=$(curl -f -s "$url")
              # ✅ FIXED: allow optional spaces around the colon in "status": "finished"
              if echo "$response" | grep -q '"status": *"finished"'; then
                echo "Purge succeeded for $file"
                success=true
                break
              else
                echo "Attempt $attempt failed, retrying..."
                sleep 5
              fi
            done
            if [ "$success" = false ]; then
              echo "ERROR: Purge failed for $file"
              exit 1
            fi
            # Small delay between files to respect jsDelivr throttling
            sleep 2
          done

          echo "Verifying CDN content..."
          for file in "${FILES[@]}"; do
            cdn_url="https://cdn.jsdelivr.net/gh/$REPO@$BRANCH/$file"
            local_hash=$(sha256sum "$file" | cut -d' ' -f1)
            for attempt in 1 2 3 4 5; do
              cdn_hash=$(curl -sL "$cdn_url" | sha256sum | cut -d' ' -f1)
              if [ "$local_hash" = "$cdn_hash" ]; then
                echo "CDN matches for $file"
                break
              else
                echo "CDN not yet updated for $file, waiting 5s..."
                sleep 5
              fi
            done
            if [ "$local_hash" != "$cdn_hash" ]; then
              echo "WARNING: CDN still not updated for $file after verification"
              # You can choose to fail here or just warn
              # exit 1
            fi
          done
