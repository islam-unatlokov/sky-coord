name: Sync Assets from GitVerse

on:
  schedule:
    - cron: '15 2 * * *'  # Runs daily at 02:15 UTC
  workflow_dispatch:      # Enables manual trigger button in GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest assets from GitVerse
        run: |
          curl -fL "https://bno-inr-ras.gitverse.site/sky-coord-transforms/scripts/iers.js" -o iers.js
          curl -fL "https://gitverse.ru/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-astronomy-engine/equatorial-astronomy-engine.js" -o equatorial-astronomy-engine.js
          curl -fL "https://gitverse.ru/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa/equatorial-erfa.js" -o equatorial-erfa.js
          curl -fL "https://gitverse.ru/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa/erfa.js" -o erfa.js
          curl -fL "https://gitverse.ru/bno-inr-ras/sky-coord-transforms/raw/branch/master/js-erfa/erfa.wasm" -o erfa.wasm

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iers.js equatorial-astronomy-engine.js equatorial-erfa.js erfa.js erfa.wasm

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: daily update of astronomical assets [$(date +'%Y-%m-%d')]"
            git push
          fi
